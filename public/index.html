<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Link Bypasser</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Link Bypasser</h1>
    <input type="url" id="linkInput" placeholder="Paste ad link here..." required>
    <br>
    <button onclick="bypass()">Bypass Link</button>
    <div id="result" style="display: none;"></div>

    <script>
        async function bypass() {
            const input = document.getElementById('linkInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Bypassing...';

            try {
                // This calls your Render API
                const res = await fetch(`/api/bypass?url=${encodeURIComponent(input)}`);
                const data = await res.json();
                
                if(data.success) {
                    resultDiv.innerHTML = `<strong>Success!</strong><br><br><a href="${data.bypassed}" target="_blank">${data.bypassed}</a>`;
                } else {
                    resultDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<strong>Error connecting to API</strong>`;
            }
        }
    </script>
</body>
</html>
